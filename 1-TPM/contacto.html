        <main>
          
          <div class="container py-5">
            <div class="row justify-content-center col-md-7 col-md-8 mt-5 mx-auto">
              <h4 class="mb-3"><strong>Formulario de contacto</strong></h4>
              <form class="needs-validation" method="post" novalidate>
                <div class="row g-3">
                  <div class="col-sm-12">
                    <label for="firstName" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="firstName" placeholder="" value="" required/>
                    <div class="invalid-feedback">
                      Rellena este campo.
                    </div>
                  </div>
                  <div class="col-sm-12">
                    <label for="Apellido" class="form-label">Apellidos</label>
                    <input type="text" class="form-control" id="lastName" placeholder="" value="" required/>
                    <div class="invalid-feedback">
                      Rellena este campo.
                    </div>
                  </div>
                  </div>
                  <div class="col-12">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required/>
                    <div class="invalid-feedback">
                      Por favor, introduce un correo electrónico válido.
                      </div>
                  </div>
                  <div class="col-12">
                    <label for="numero" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="numero"required/>
                    <div class="invalid-feedback">
                      Por favor, introduce un número de teléfono válido.
                    </div>
                  </div>
                  <div class="col-12">
                    <label for="address2" class="form-label">Localidad</label>
                    <input type="text" class="form-control" id="address2"/>
                  </div>
                  <div class="col-6">
                    <label for="servicio" class="form-label">¿Qué servicio buscas?</label>
                    <select class="form-select" id="servicio" required>
                      <option value="">Escoge el servicio que más te interese</option>
                      <option>Diseño web</option>
                      <option>Diseño de marca</option>
                      <option>Identidad visual</option>
                      <option>Diseño de app</option>
                      <option>Otros</option>
                    </select>
                    <div class="invalid-feedback">
                      Por favor, selecciona un servicio.
                    </div> 
                  </div>
                  <div class="col-12">
                    <label for="mensaje" class="form-label">Mensaje adicional</label>
                    <input type="textarea" class="form-control" id="mensaje" placeholder="Escribe aquí cualquier detalle adicional sobre tu proyecto o consulta"/>
                  </div>
                </div>
                <div class="form-check justify-content-center">
                  <input type="checkbox" class="form-check-input" id="same-address"/>
                  <label class="form-check-label" for="same-address"
                    >Acepto recibir información sobre los servicios</label>
                </div>
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="save-info"/>
                  <label class="form-check-label" for="save-info"
                    >Acepto la política de privacidad</label>
                </div>
                <hr class="my-4" />
                <button class="botonenviar" type="submit">
                  Enviar formulario
                </button>
              </form>
            </div>
          </div>
    <script
      src="../assets/dist/js/bootstrap.bundle.min.js"

    ></script>
